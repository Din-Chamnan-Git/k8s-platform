apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-demo-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Din-Chamnan-Git/go-demo-api.git'
    targetRevision: HEAD
    path: chart
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
