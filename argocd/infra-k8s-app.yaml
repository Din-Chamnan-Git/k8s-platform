apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-platform-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Din-Chamnan-Git/k8s-platform.git'
    targetRevision: main
    path: .
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dnan-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
