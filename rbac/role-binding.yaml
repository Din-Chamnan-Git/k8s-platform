# ==============================================================================
# RBAC RoleBinding (The Bridge)
# ==============================================================================
# Connects the 'app-service-account' identity (WHO) to the 'app-secret-reader-role'
# permissions (WHAT) inside the 'dnan-prod' namespace.
# ==============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-secret-reader-binding
  namespace: dnan-prod
  labels:
    app.kubernetes.io/name: app-secret-reader-binding
    environment: production
subjects:
  # The Identity receiving permissions
  - kind: ServiceAccount
    name: app-service-account
    namespace: dnan-prod

roleRef:
  # The Role defining the permissions
  kind: Role
  name: app-secret-reader-role
  apiGroup: rbac.authorization.k8s.io
