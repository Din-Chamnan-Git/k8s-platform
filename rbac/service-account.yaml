# ==============================================================================
# Service Account Identity Definition
# ==============================================================================
# This creates a dedicated Service Account identity for applications running in 
# the 'dnan-prod' namespace. When attached to a pod, Kubernetes will automatically
# generate and mount a secure JWT token inside the container.
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: dnan-prod
  labels:
    app.kubernetes.io/name: app-service-account
    app.kubernetes.io/part-of: portfolio-platform
    environment: production
  annotations:
    description: "Dedicated ServiceAccount identity for production backend applications"
