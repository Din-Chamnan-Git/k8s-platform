apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ui-ingress
  namespace: longhorn-system
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - "longhorn.dnan.tech"
    secretName: cloudflare-tls
  rules:
  - host: "longhorn.dnan.tech"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: longhorn-frontend
            port:
              number: 80
