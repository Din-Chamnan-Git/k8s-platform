# ==============================================================================
# 1. ClusterSecretStore: Connection to Vault Server
# ==============================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      # Vault VM is on the same gcp-k8s-vpc (private IP: 10.10.1.5).
      # Using private IP avoids public DNS lookup and internet routing.
      # caBundle: Vault self-signed TLS cert so ESO can verify the connection.
      server: "https://vault.dnan.tech:8200"
      path: "secret"
      version: "v2"
      caProvider:
        type: Secret
        name: vault-ca-cert
        namespace: external-secrets
        key: ca.crt

      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets-role"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"

---
# ==============================================================================
# 2. ExternalSecret: Syncs Vault postgres secrets → native K8s Secret
# ==============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secret-sync
  namespace: dnan-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-secret # Must match the name in postgres-statefulset.yaml
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: postgres
        property: POSTGRES_DB
    - secretKey: POSTGRES_USER
      remoteRef:
        key: postgres
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres
        property: POSTGRES_PASSWORD

---
# ==============================================================================
# 3. ExternalSecret: Syncs Vault GitHub PAT → GHCR ImagePullSecret in dnan-prod
# ==============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-secret-sync
  namespace: dnan-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-secret # Target docker-registry secret for pulling private GHCR images
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"},"registry.dnan.tech":{"username":"{{ .nexus_username }}","password":"{{ .nexus_password }}","auth":"{{ printf "%s:%s" .nexus_username .nexus_password | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: github
        property: username
    - secretKey: password
      remoteRef:
        key: github
        property: password
    - secretKey: nexus_username
      remoteRef:
        key: nexus
        property: username
    - secretKey: nexus_password
      remoteRef:
        key: nexus
        property: password

---
# ==============================================================================
# 4. ExternalSecret: Syncs Vault GitHub PAT → ArgoCD Repo Secret in argocd
# ==============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-repo-sync
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-repo-k8s-platform
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: "git"
        url: "https://github.com/Din-Chamnan-Git/k8s-platform.git"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: github
        property: username
    - secretKey: password
      remoteRef:
        key: github
        property: password

